 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pizza Menu Project</title>

    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="Pizza_CSS/Pizza.css">

    <!-- Connect the JavaScript file -->
    <script src="Pizza_JavaScript/Pizza.js" defer></script>
</head>

<body>
    <div id="menuBG">

        <h1>Pizza Menu</h1>

        <!-- Button to calculate the order and show the receipt -->
        <input
            id="btnOrder"
            type="button"
            onclick="getReceipt()"
            value="Place Order"
        >

        <form id="frmMenu">

            <!-- Pizza size options -->
            <div class="menu left">
                <h3>Size:</h3>

                <input class="size" type="radio" name="Size"
                    value="Personal Pizza"> Personal Pizza<br>

                <input class="size" type="radio" name="Size"
                    value="Small Pizza"> Small Pizza<br>

                <input class="size" type="radio" name="Size"
                    value="Medium Pizza"> Medium Pizza<br>

                <input class="size" type="radio" name="Size"
                    value="Large Pizza" checked> Large Pizza<br>

                <input class="size" type="radio" name="Size"
                    value="Extra Large Pizza"> Extra Large Pizza<br>
            </div>

            <!-- Vegetable topping options -->
            <div class="menu center">
                <h3>Vegetables:</h3>

                <input class="toppings" type="checkbox" name="Topping"
                    value="Mushrooms"> Mushrooms<br>

                <input class="toppings" type="checkbox" name="Topping"
                    value="Onions"> Onions<br>

                <input class="toppings" type="checkbox" name="Topping"
                    value="Tomatoes"> Tomatoes<br>

                <input class="toppings" type="checkbox" name="Topping"
                    value="Olives"> Olives<br>

                <input class="toppings" type="checkbox" name="Topping"
                    value="Green Peppers"> Green Peppers<br>
            </div>

            <!-- Meat topping options -->
            <div class="menu right">
                <h3>Meats:</h3>

                <input class="toppings" type="checkbox" name="Topping"
                    value="Pepperoni"> Paneed<br>

                <input class="toppings" type="checkbox" name="Topping"
                    value="Sausage"> Sausage<br>

                <input class="toppings" type="checkbox" name="Topping"
                    value="Canadian Bacon"> Canadian Bacon<br>

                <input class="toppings" type="checkbox" name="Topping"
                    value="Ground Beef"> Ground Beef<br>

                <input class="toppings" type="checkbox" name="Topping"
                    value="Anchovy"> Anchovy<br>

                <input class="toppings" type="checkbox" name="Topping"
                    value="Chicken"> Vegitable<br>

                <input class="toppings" type="checkbox" name="Topping"
                    value="Salami"> Pavbhaji<br>
            </div>

            <!-- Receipt and total price -->
            <div id="cart">
                <div id="showText"></div>
                <div id="totalPrice"></div>
            </div>

        </form>
    </div>
</body>
</html>
