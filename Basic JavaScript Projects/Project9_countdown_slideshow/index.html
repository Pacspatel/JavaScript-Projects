
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project9_countdown_slideshow</title>

    <!-- Connect the CSS file. -->
    <link rel="stylesheet" type="text/css" href="CSS/style.css">
</head>
<body>

    <!-- Countdown Timer Section -->
    <h1>Countdown Timer</h1>

    <p>How many seconds would you like to set your alarm for?</p>

    <input type="number" id="seconds" value="10">
    <button onclick="countdown()" id="startBtn">Click here</button>

    <p id="timer"></p>


    <!-- Slideshow Section -->
    <h1>Image Slideshow</h1>

    <div class="slideshow-container">

        <!-- First image -->
        <div class="mySlides fade">
            <div class="numbertext">1 / 3</div>
            <img src="Images/car1.jpg"  alt="Car - 1 ">
            <div class="text"> Car -1 s</div>
        </div>

        <!-- Second image -->
        <div class="mySlides fade">
            <div class="numbertext">2 / 3</div>
            <img src="Images/car2.jpg"  alt="Car - 2 ">
            <div class="text"> Car - 2 </div>
        </div>

        <!-- Third image -->
        <div class="mySlides fade">
            <div class="numbertext">3 / 3</div>
            <img src="Images/car3.jpg"   alt="Car - 3 ">
            <div class="text"> Car - 3 </div>
        </div>

        <!-- Previous and Next buttons -->
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>

    </div>

    <br>

    <!-- Dots for selecting images -->
    <div style="text-align: center">
        <span class="dot" onclick="currentSlide - Car1 ""></span>
        <span class="dot" onclick="currentSlide - Car2 "></span>
        <span class="dot" onclick="currentSlide - Car3 "></span>
    </div>

    <!-- Connect the JavaScript file. -->
    <script src="JS/main.js"></script>

</body>
</html>
