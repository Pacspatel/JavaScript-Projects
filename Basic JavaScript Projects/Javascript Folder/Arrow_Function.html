
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arrow Function Challenge</title>
</head>
<body>

    <h1>My JavaScript Function</h1>

    <p id="demo"></p>

<script>
    // Create an arrow function
    const myFunction = () => {
        return "Hello! This is my arrow function.";
    };

    // Display the result
    document.getElementById("demo").innerHTML = myFunction();
</script>

</body>
</html>
