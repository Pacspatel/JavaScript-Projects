<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Assignments</title>

    <!-- Link to the JavaScript file -->
    <script src="JavaScript/JavaScript_1.js" defer></script>
</head>
<body>

    <h1>JavaScript Assignments</h1>

    <!-- Switch Statement Assignment -->
    <h2>Switch Statement</h2>

    <p>Choose your favorite animal:</p>

    <select id="Animal">
        <option value="Dog">Dog</option>
        <option value="Cat">Cat</option>
        <option value="Lion">Lion</option>
        <option value="Elephant">Elephant</option>
    </select>

    <button onclick="animal_function()">Choose Animal</button>

    <p id="Answer"></p>


    <!-- getElementsByClassName() Assignment -->
    <h2>getElementsByClassName()</h2>

    <p class="animal">Dogs are friendly animals.</p>
    <p class="animal">Cats like to sleep.</p>
    <p class="animal">Lions are wild animals.</p>

    <button onclick="change_text()">Change Animal Text</button>


    <!-- Canvas Element Assignment -->
    <h2>Canvas Element</h2>

    <canvas id="myCanvas" width="400" height="200"
        style="border: 2px solid black;">
        Your browser does not support the canvas element.
    </canvas>

</body>
</html>
